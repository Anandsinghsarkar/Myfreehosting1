<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — A7 HOSTING</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">A7</div>
            <div class="logo-text">A7 HOSTING</div>
        </div>
        <h1>Welcome Back 👋</h1>
        <p class="sub">Sign in with Google to host your Telegram bots 24/7</p>

        <button id="googleBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
            Continue with Google
        </button>

        <div class="divider">SECURE AUTHENTICATION</div>

        <div id="errorBox" class="flash flash-error" style="display:none;"></div>

        <div class="footer-note">
            By continuing, you agree to our Terms of Service & Privacy Policy.
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "{{ fb_config.apiKey }}",
    authDomain: "{{ fb_config.authDomain }}",
    projectId: "{{ fb_config.projectId }}",
    storageBucket: "{{ fb_config.storageBucket }}",
    messagingSenderId: "{{ fb_config.messagingSenderId }}",
    appId: "{{ fb_config.appId }}"
});

const provider = new firebase.auth.GoogleAuthProvider();
const explicitlyLoggedOut = new URLSearchParams(window.location.search).get('logged_out') === '1';

async function createServerSession(user) {
    const idToken = await user.getIdToken();
    const res = await fetch('/auth/session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ idToken })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Login session could not be created');
    window.location.replace(data.is_admin ? '/admin' : '/dashboard');
}

// Firebase keeps the Google sign-in locally; restore the server session on later visits.
// Explicit logout is the only path that clears Firebase persistence.
if (explicitlyLoggedOut) {
    firebase.auth().signOut().catch(() => {});
    window.history.replaceState({}, document.title, '/login');
} else {
    firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) return;
        try {
            await createServerSession(user);
        } catch (e) {
            const errBox = document.getElementById('errorBox');
            errBox.textContent = e.message || 'Session restore failed';
            errBox.style.display = 'block';
        }
    });
}

document.getElementById('googleBtn').addEventListener('click', async () => {
    const errBox = document.getElementById('errorBox');
    errBox.style.display = 'none';
    try {
        const result = await firebase.auth().signInWithPopup(provider);
        await createServerSession(result.user);
    } catch (e) {
        errBox.textContent = e.message || 'Google sign-in failed';
        errBox.style.display = 'block';
    }
});
</script>
</body>
</html>

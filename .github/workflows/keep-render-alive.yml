name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
        run: |
          set -eu
          if [ -z "${TARGET_URL:-}" ]; then
            echo "Missing GitHub Actions variable TARGET_URL."
            echo "Set it to your Render service base URL, for example https://your-service.onrender.com"
            exit 1
          fi

          BASE_URL="${TARGET_URL%/}"
          echo "Pinging ${BASE_URL}/health"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 25 \
            "${BASE_URL}/health"
          echo
